name: Bug report
description: Report incorrect worker or pipeline behaviour.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Add steps, versions, and sanitized evidence using synthetic data.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit, model, prompt, or dataset version.
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: I removed secrets and private user content.
          required: true
