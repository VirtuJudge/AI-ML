name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native provider libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg \
            libegl1 \
            libgl1 \
            libgomp1 \
            libglib2.0-0 \
            libgles2 \
            libsndfile1

      - name: Install locked project and development dependencies
        run: |
          python -m pip install --no-cache-dir uv
          uv sync --frozen --all-extras --all-groups

      - name: Validate repository and run deterministic unit suite
        run: uv run bash scripts/validate-repository.sh

  live-provider-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build locked live provider image
        run: docker build --target live -t virtujudge-ai-ml:live-check .

      - name: Check live provider dependencies at startup
        run: >-
          docker run --rm --entrypoint python virtujudge-ai-ml:live-check
          scripts/check_live_provider_install.py
