[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtujudge-ai-ml"
version = "0.1.0"
description = "VirtuJudge AI-ML Python worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "redis[hiredis]",
    "httpx",
    "ulid-py",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]
speech = [
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
groq = [
    "httpx",
]
dev-providers = [
    "httpx",
]
vision = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.8.0",
]
audio = [
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
documents = [
    "pymupdf>=1.25.0",
    "python-pptx>=1.0.0",
]
embeddings = [
    "httpx",
]
storage = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
